<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./imgs/webIcon.png" />
    <title>To-do App</title>
  </head>
  <body>
    <div id="main-container">
      <!-- Window 1 Tab  -->
      <!-- Where Edit profile, See Upcoming Tasks, See Completed Tasks and Sign Out displayed  -->
      <div id="menu-window-1" class="window-container">
        <img
          id="profile-pic"
          src="./imgs/Random-man.jpg"
          alt="Profile Picture"
          class="profile-pic"
        />
        <button id="edit-profile" class="edit-profile-btn">Edit Profile</button>
        <button id="upcoming-task" class="upcoming-task-btn">
          See Upcoming Tasks
        </button>
        <button id="completed-task" class="completed-task-btn">
          See Completed Tasks
        </button>
        <button id="sign-out" class="sign-out-btn">Sign Out</button>
      </div>

      <!-- Window 2 Tab  -->

      <div id="menu-window-2" class="window-container">
        <div class="date-time">
          <!-- <h4 class="current-date">Monday | September 5, 2024</h4>
          <span class="current-time"><h1>09:48PM</h1></span> -->
        </div>
        <!-- Date and Time Section  -->

        <div id="date-weather-time" class="date-weather-time-container">
          <!-- Weather card and new Date, new Time Section  -->
          <form action="" class="weather-form">
            <input
              type="text"
              class="city-input"
              id="city-input"
              placeholder="Enter City"
            />
            <button type="submit">Search City</button>
          </form>

          <!-- Full Weather Description based on Input Section  -->

          <div class="weather-card" id="weather-card" style="display: none">
            <!-- <h1 class="city-display">Rizal</h1>
            <p class="temp-humidity-display">
              <i class="bx bxs-thermometer"></i>Temp: 90°F
              <span class="humidity"
                ><i class="bx bx-wind"></i>Humidity: 75%</span
              >
            </p>
            <p class="weather-emoji"></p>
            <p class="description-display">Clear Skies</p> -->
          </div>
          <p id="blank-msg">Input city to see status</p>
        </div>

        <!-- Where Weather API, Date and Hour Method will be put  -->

        <!-- This is where Task Container of Todo notes will be input  -->
        <div id="task-container">
          <button id="add-new-task" class="add-new-task">
            <i class="bx bx-plus"></i>
            <p class="add-new-task-text">Add New Task</p>
          </button>
          <ul id="tasks-list" class="tasks-list">
            <!-- <li class="task-details">
              <input type="checkbox" id="added-task" />
              <h4 class="input-title">Clean Motorcycle</h4>
              <span class="time-submit"
                ><p><i>created:</i> September 20, 2024</p></span
              >
              <span class="tap-to-edit"
                ><p><i>tap to edit</i></p></span
              >
            </li> -->
          </ul>
        </div>

        <div id="myModal" class="modal">
          <div class="modal-content">
            <div class="close"><i class="bx bx-x"></i></div>
            <form id="task-form">
              <label for="title-input"><h1 class="title">Title:</h1></label>
              <input
                type="text"
                id="title-input"
                class="title-input"
                placeholder="Enter Title"
              />
              <label for="desc-input"><h1 class="desc">Description:</h1></label>
              <textarea
                id="desc-input"
                class="desc-input"
                placeholder="Enter Description"
              ></textarea>

              <button type="submit-save" id="save-btn" class="save-btn">
                Save Task
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Window 3 Tab -->
      <div id="menu-window-3" class="window-container">
        <!-- <h1 class="upcoming-feature-msg">This feature will be updated soon</h1> -->
      </div>
    </div>

    <!-- <div class="newsletter-container">
      <h2>Testing</h2>
    </div> -->
  </body>
  <script src="app.js"></script>
</html>
